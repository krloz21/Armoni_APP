<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="¿Qué se acabó?">
<meta name="theme-color" content="#f4f5f7" id="colorTema">
<script>try{var t=localStorage.getItem("mama.tema")||"claro";document.documentElement.dataset.tema=t==="oscuro"?"":"claro";document.getElementById("colorTema").content=t==="oscuro"?"#000000":"#f4f5f7";}catch(e){document.documentElement.dataset.tema="claro";}</script>
<title>¿Qué se acabó?</title>
<link rel="manifest" href="mama.webmanifest">
<link rel="apple-touch-icon" href="mama-192.png">
<link rel="icon" type="image/png" href="mama-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#000000; --panel:rgba(6,8,13,.94); --line:rgba(255,255,255,.11);
  --ghost:rgba(255,255,255,.55); --dim:rgba(255,255,255,.4); --white:#f5f6f7;
  --blue:#3f7cf6; --cyan:#7ee8ff; --clay:#f2734f;
  --fondo:radial-gradient(120% 60% at 50% 0%, #0d1424 0%, #000 70%);
  --item:rgba(18,22,34,.85); --item-sh:inset 0 1px 0 rgba(255,255,255,.1);
  --input:rgba(14,18,30,.9); --inputf:rgba(10,14,24,.7);
  --chip:rgba(255,255,255,.07); --xbtn:rgba(255,255,255,.1); --btn:rgba(255,255,255,.05);
  --h1a:#fff; --h1b:#8fa4c4; --fuerte:#fff; --on-accent:#03070f; --on-clay:#1f0a04;
  --modal-scrim:rgba(0,3,10,.55); --modal-bg:linear-gradient(180deg, rgba(14,18,30,.94), rgba(6,8,14,.97));
  --modal-sh:inset 0 1px 0 rgba(255,255,255,.14), 0 30px 70px rgba(0,0,0,.55); --aviso-sh:0 14px 40px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
/* tema claro: fondo blanco, para quien no quiere lo oscuro */
:root[data-tema="claro"]{
  --void:#f4f5f7; --panel:rgba(255,255,255,.98); --line:rgba(20,24,34,.13);
  --ghost:rgba(20,24,34,.64); --dim:rgba(20,24,34,.52); --white:#15181f;
  --blue:#2f66e0; --cyan:#3aa9d4; --clay:#e2552f;
  --fondo:linear-gradient(180deg, #ffffff 0%, #f1f3f6 100%);
  --item:#ffffff; --item-sh:0 1px 2px rgba(20,24,34,.06), 0 6px 18px -10px rgba(20,24,34,.2);
  --input:#ffffff; --inputf:#ffffff;
  --chip:rgba(20,24,34,.06); --xbtn:rgba(20,24,34,.08); --btn:rgba(20,24,34,.05);
  --h1a:#15181f; --h1b:#4a5a78; --fuerte:#15181f; --on-accent:#ffffff; --on-clay:#ffffff;
  --modal-scrim:rgba(20,24,34,.35); --modal-bg:#ffffff;
  --modal-sh:0 30px 70px rgba(20,24,34,.25); --aviso-sh:0 14px 40px -16px rgba(20,24,34,.35);
  color-scheme:light;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body{ margin:0; background:var(--void); color:var(--white); }
body{ background:var(--fondo) fixed; }
body{
  font-family:"Schibsted Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size:20px; line-height:1.4; -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 calc(28px + env(safe-area-inset-bottom));
}
.col{ position:relative; z-index:1; max-width:560px; margin:0 auto; }
header{ position:relative; padding:26px 20px 6px; }
.tema{ position:absolute; top:22px; right:16px; width:48px; height:48px; border-radius:50%; border:1px solid var(--line); background:var(--item); color:var(--white); display:grid; place-items:center; cursor:pointer; box-shadow:var(--item-sh); }
.tema svg{ width:22px; height:22px; }
.tema .luna{ display:none; }
:root[data-tema="claro"] .tema .sol{ display:none; }
:root[data-tema="claro"] .tema .luna{ display:block; }
.tema:active{ transform:scale(.94); }
h1{ padding-right:56px; }
h1{
  margin:0; font-size:2.1rem; font-weight:600; letter-spacing:-.02em;
  background:linear-gradient(180deg, var(--h1a) 35%, var(--h1b)); -webkit-background-clip:text; background-clip:text; color:transparent;
}
header p{ margin:8px 0 0; color:var(--ghost); font-size:1.02rem; }
.busca{ position:relative; margin:18px 20px 0; }
.busca svg{ z-index:1; position:absolute; left:16px; top:50%; width:20px; height:20px; transform:translateY(-50%); color:var(--ghost); pointer-events:none; }
.busca input{
  width:100%; padding:15px 46px 15px 46px; border-radius:999px; border:1px solid var(--line); background:var(--input);
  color:var(--white); font:inherit; font-size:1.02rem; outline:none; -webkit-appearance:none; appearance:none;
  transition:border-color .25s, background .25s;
}
.busca input::placeholder{ color:var(--dim); }
.busca input:focus{ border-color:var(--cyan); background:var(--inputf); }
.busca input::-webkit-search-cancel-button{ display:none; }
.busca .x{ z-index:1; position:absolute; right:8px; top:50%; width:34px; height:34px; transform:translateY(-50%); border:0; border-radius:50%; background:var(--xbtn); color:var(--white); display:grid; place-items:center; cursor:pointer; }
.busca .x[hidden]{ display:none; }
.busca .x svg{ position:static; width:14px; height:14px; transform:none; color:inherit; }
.cuenta[hidden]{ display:none; }
.cuenta{ display:inline-block; margin-top:14px; padding:9px 18px; border:1px solid transparent; border-radius:999px; background:rgba(242,115,79,.14); color:var(--clay); font:inherit; font-weight:700; font-size:.92rem; cursor:pointer; transition:background .25s, color .25s, transform .1s ease-out; }
.cuenta:active, .gmarc:active{ transform:scale(.96); }
.cuenta[aria-pressed="true"], .gmarc[aria-pressed="true"]{ background:var(--clay); color:var(--on-clay); }
.gcab{ display:flex; align-items:center; gap:10px; margin:26px 20px 4px; }
.gcab .grupo{ width:auto; flex:1; margin:0; min-width:0; }
.gmarc{ flex:none; padding:7px 13px; border:1px solid rgba(242,115,79,.45); border-radius:999px; background:rgba(242,115,79,.12); color:var(--clay); font:inherit; font-size:.82rem; font-weight:700; cursor:pointer; transition:background .25s, color .25s, transform .1s ease-out; }

.grupo{
  display:flex; align-items:center; gap:8px; width:calc(100% - 40px);
  margin:26px 20px 4px; padding:9px 0; border:0; background:none; color:var(--dim); font:inherit;
  font-size:.88rem; font-weight:700; color:var(--fuerte); letter-spacing:.08em; text-transform:uppercase; cursor:pointer;
}
.grupo .chev{ width:14px; height:14px; flex:none; color:var(--ghost); transition:transform .35s cubic-bezier(.16,1,.3,1); }
.grupo .chev svg{ width:100%; height:100%; display:block; }
.grupo[aria-expanded="true"] .chev{ transform:rotate(90deg); }
.grupo .n{ flex:1; text-align:left; }
.grupo .c{ font-size:.78rem; font-weight:400; color:var(--dim); letter-spacing:0; text-transform:none; }

.cuerpo{ display:none; }
.cuerpo.on{ display:block; }
.lista{ margin:8px 14px 0; display:grid; gap:11px; }

.item{
  display:flex; align-items:center; gap:16px; width:100%; padding:21px 18px; border-radius:22px;
  border:1px solid var(--line); background:var(--item); color:var(--white); font:inherit; text-align:left; cursor:pointer;
  box-shadow:var(--item-sh); transition:transform .1s ease-out, background .25s, border-color .25s;
}
.item:active{ transform:scale(.98); }
.item .e{ font-size:2.3rem; width:50px; text-align:center; flex:none; }
.item .n{ flex:1; font-weight:600; font-size:1.05rem; }
.item .s{ font-size:.9rem; padding:8px 14px; border-radius:999px; background:var(--chip); color:var(--dim); white-space:nowrap; flex:none; }
.item.acabo{ background:rgba(242,115,79,.1); border-color:rgba(242,115,79,.45); }
.item.acabo .s{ background:var(--clay); color:var(--on-clay); font-weight:700; }
.item.envio{ opacity:.55; }
.estado{ margin:30px 20px; color:var(--dim); font-size:1.05rem; }

.aviso{
  position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translate(-50%, 140px);
  background:var(--panel); border:1px solid var(--line); padding:14px 20px; border-radius:17px; font-size:1.02rem;
  transition:transform .35s cubic-bezier(.22,1,.36,1); width:max-content; max-width:90vw; text-align:center;
  box-shadow:var(--aviso-sh); z-index:5;
}
.aviso.on{ transform:translate(-50%, 0); }
.aviso.mal{ border-color:rgba(242,115,79,.55); }

/* con una ventana abierta, el fondo y la lista se desenfocan como con el menú de Armoni */
.cfScrim{ position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--modal-scrim); opacity:0; transition:opacity .3s ease; }
.cfScrim.on{ opacity:1; }
.cfCard{
  width:min(100%, 330px); text-align:center; padding:26px 22px 18px; border-radius:24px;
  background:var(--modal-bg); border:1px solid var(--line);
  box-shadow:var(--modal-sh);
  transform:translateY(14px) scale(.96); transition:transform .38s cubic-bezier(.16,1,.3,1);
}
.cfScrim.on .cfCard{ transform:none; }
.cfCard h3{ margin:0; font-size:1.25rem; font-weight:600; letter-spacing:-.015em; }
.cfCard p{ margin:10px 0 0; color:var(--ghost); font-size:1rem; }
.cfRow{ display:flex; gap:10px; margin-top:22px; }
.cfRow button{ flex:1; padding:15px 8px; border-radius:16px; font:inherit; font-size:1rem; font-weight:600; cursor:pointer; border:1px solid var(--line); background:var(--btn); color:var(--white); }
.cfRow .cfSi{ background:linear-gradient(140deg, var(--cyan), var(--blue)); color:var(--on-accent); border:0; }
.cfRow button:active{ transform:scale(.97); }
</style>
</head>
<body>
<div class="col">
<header>
  <button type="button" class="tema" id="tema" aria-label="Cambiar entre claro y oscuro"><svg class="sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg></button>
  <h1>¿Qué se acabó?</h1>
  <p>Toca lo que haga falta comprar. Le llega directo a la lista del mercado.</p>
  <button type="button" class="cuenta" id="cuenta" hidden></button>
</header>
<div class="busca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="buscar" type="search" placeholder="Buscar algo de la lista" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search"><button type="button" class="x" id="buscarX" aria-label="Borrar búsqueda" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<main id="main"><p class="estado">Cargando…</p></main>
</div>
<div class="aviso" id="aviso" role="status"></div>
<script>
/* ════════════════════════════════════════════════════════════
   FONDO DE LÍNEAS (WebGL): las mismas líneas que caen del fondo de Armoni
   ════════════════════════════════════════════════════════════ */
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ventana de confirmación centrada: devuelve true si dice que sí */
function confirmar(titulo, texto, si){
  return new Promise(resolve => {
    const scrim = document.createElement("div");
    scrim.className = "cfScrim";
    scrim.innerHTML = '<div class="cfCard" role="dialog" aria-modal="true"><h3></h3><p></p>' +
      '<div class="cfRow"><button type="button" class="cfNo">No</button><button type="button" class="cfSi"></button></div></div>';
    scrim.querySelector("h3").textContent = titulo;
    if(texto) scrim.querySelector("p").textContent = texto; else scrim.querySelector("p").remove();
    scrim.querySelector(".cfSi").textContent = si;
    document.body.appendChild(scrim);
    document.body.classList.add("dlg");
    requestAnimationFrame(() => scrim.classList.add("on"));
    const cierra = v => {
      scrim.classList.remove("on"); document.body.classList.remove("dlg");
      setTimeout(() => scrim.remove(), 300);
      resolve(v);
    };
    scrim.querySelector(".cfSi").addEventListener("click", () => cierra(true));
    scrim.querySelector(".cfNo").addEventListener("click", () => cierra(false));
    scrim.addEventListener("click", e => { if(e.target === scrim) cierra(false); });
  });
}
/* con https (Tailscale) las páginas llaman a n8n por la misma dirección; en la red de casa, por la IP de siempre */
const N8N = location.protocol === "https:" ? "" : "http://192.168.1.7:5678";
const ESTADO_URL = N8N + "/webhook/mercado-estado";
const MARCAR_URL = N8N + "/webhook/mercado-marcar";
const TOKEN = "mercado-7d41c2a9e05b";
const GRUPOS = ["Despensa", "Lácteos", "Carnes", "Ema", "Aseo"];
const EMOJIS = [["panqueque","🥞"],["panela","🟫"],["pan","🍞"],["arroz","🍚"],["chocolate","🍫"],["leche","🥛"],["guisamar","🧂"],["sal","🧂"],
  ["azúcar","🍬"],["azucar","🍬"],["oliva","🫒"],["aceite","🛢️"],["pasta","🍝"],["frijol","🫘"],["lenteja","🫘"],["crispeta","🍿"],["queso","🧀"],
  ["mantequilla","🧈"],["cereal","🥣"],["carne","🥩"],["cerdo","🍖"],["pollo","🍗"],["ariel","🧺"],["axion","🧽"],["dientes","🪥"],["shampoo","🧴"],
  ["papel","🧻"],["desodorante","🧴"],["jabón","🧼"],["jabon","🧼"],["talco","🫧"],["tomate","🍅"],["huevo","🥚"],["fruta","🍎"],["verdura","🥬"]];
const emoji = n => { const s = String(n || "").toLowerCase(); for(const [k, e] of EMOJIS) if(s.includes(k)) return e; return "🛒"; };
const esc = t => String(t).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const main = document.getElementById("main");
const cuenta = document.getElementById("cuenta");
const aviso = document.getElementById("aviso");
let productos = [];
let tAviso = null;

/* qué grupos están abiertos: al entrar siempre empiezan todos cerrados (solo se recuerda mientras la página sigue abierta) */
const abiertos = new Set();

function avisar(texto, mal){
  aviso.textContent = texto;
  aviso.classList.toggle("mal", !!mal);
  aviso.classList.add("on");
  clearTimeout(tAviso);
  tAviso = setTimeout(() => aviso.classList.remove("on"), 2600);
}
/* «solo marcadas»: tocar el contador de arriba muestra solo lo marcado de todos los apartados; el de cada apartado, solo lo de ese apartado */
let soloTodo = false;
const soloG = new Set();
function contar(){
  const n = productos.filter(p => p.falta).length;
  cuenta.hidden = !n;
  cuenta.textContent = soloTodo ? "Ver todo" : (n === 1 ? "1 cosa marcada · ver" : n + " cosas marcadas · ver");
  cuenta.setAttribute("aria-pressed", String(soloTodo));
  if(!n && (soloTodo || soloG.size)){ soloTodo = false; soloG.clear(); pintar(); }   // ya no queda nada marcado: vuelve la lista completa
}

const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

const buscar = document.getElementById("buscar"), buscarX = document.getElementById("buscarX");
const norm = t => String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

function pintar(){
  const q = norm(buscar.value);
  let html = "", hallados = 0;
  GRUPOS.concat(["Otros"]).forEach(g => {
    const delGrupo = productos.filter(p => (GRUPOS.includes(p.grupo) ? p.grupo : "Otros") === g);
    const marcadas = delGrupo.filter(p => p.falta).length;
    const solo = soloTodo || soloG.has(g);
    const del = delGrupo.filter(p => (!q || norm(p.nombre).includes(q)) && (!solo || p.falta));
    if(!del.length) return;
    hallados += del.length;
    const abierto = q || solo ? true : abiertos.has(g);   // buscando o filtrando, se abre lo que coincide
    html += '<div class="gcab"><button type="button" class="grupo" data-g="' + esc(g) + '" aria-expanded="' + abierto + '">' +
      '<span class="chev" aria-hidden="true">' + CHEV + '</span><span class="n">' + g + '</span>' +
      '<span class="c">' + del.length + '</span></button>' +
      (marcadas ? '<button type="button" class="gmarc" data-gm="' + esc(g) + '" aria-pressed="' + soloG.has(g) + '">' + (soloG.has(g) ? "Ver todo" : marcadas === 1 ? "1 marcada" : marcadas + " marcadas") + '</button>' : '') + '</div>' +
      '<div class="cuerpo' + (abierto ? ' on' : '') + '"><div><div class="lista">' + del.map(p =>
        '<button type="button" class="item' + (p.falta ? ' acabo' : '') + '" data-id="' + p.id + '">' +
        '<span class="e" aria-hidden="true">' + emoji(p.nombre) + '</span><span class="n">' + esc(p.nombre) + '</span>' +
        '<span class="s">' + (p.falta ? "Ya hay que comprar" : "Hay") + '</span></button>'
      ).join("") + '</div></div></div>';
  });
  main.innerHTML = html || (q && productos.length ? '<p class="estado">No se encuentra «' + esc(buscar.value.trim()) + '» en la lista.</p>' : '<p class="estado">No hay productos en la lista todavía.</p>');
  contar();
}

buscar.addEventListener("input", () => { buscarX.hidden = !buscar.value; pintar(); });
buscar.addEventListener("keydown", e => { if(e.key === "Enter") buscar.blur(); });
buscarX.addEventListener("click", () => { buscar.value = ""; buscarX.hidden = true; pintar(); buscar.focus(); });

cuenta.addEventListener("click", () => { soloTodo = !soloTodo; soloG.clear(); pintar(); scrollTo({ top: 0, behavior: "smooth" }); });

main.addEventListener("click", async e => {
  const gm = e.target.closest(".gmarc");
  if(gm){
    const g = gm.dataset.gm;
    if(soloG.has(g)) soloG.delete(g); else soloG.add(g);
    pintar();
    return;
  }
  const cab = e.target.closest(".grupo");
  if(cab){
    const g = cab.dataset.g;
    const cuerpo = cab.closest(".gcab").nextElementSibling;
    const abrir = !abiertos.has(g);
    if(abrir) abiertos.add(g); else abiertos.delete(g);
    cab.setAttribute("aria-expanded", String(abrir));
    cuerpo.classList.toggle("on", abrir);
    return;
  }
  const btn = e.target.closest(".item");
  if(!btn || btn.classList.contains("envio")) return;
  const p = productos.find(x => x.id === btn.dataset.id);
  if(!p) return;
  /* desmarcar puede ser un error: antes de sacarlo de la lista de Armoni, se pregunta */
  if(p.falta && !(await confirmar("¿Seguro que quieres desmarcar " + p.nombre + "?", "", "Sí"))) return;
  const nuevo = !p.falta;
  p.falta = nuevo;                                   // se ve al instante, y si falla se devuelve
  btn.classList.toggle("acabo", nuevo);
  btn.querySelector(".s").textContent = nuevo ? "Ya hay que comprar" : "Hay";
  btn.classList.add("envio");
  contar();
  try{
    const res = await fetch(MARCAR_URL, { method: "POST", body: JSON.stringify({ token: TOKEN, ids: [p.id], falta: nuevo, origen: "Mamá" }) });
    if(!res.ok) throw Object.assign(new Error(), { http: res.status });
    avisar(nuevo ? "Listo: " + p.nombre + " ya hay que comprarlo" : "Listo: sí hay " + p.nombre);
  }catch(err){
    p.falta = !nuevo;
    btn.classList.toggle("acabo", !nuevo);
    btn.querySelector(".s").textContent = !nuevo ? "Ya hay que comprar" : "Hay";
    contar();
    avisar(err && err.http ? "Armoni no pudo guardarlo (error " + err.http + ")" : "No se pudo enviar. Revisa tu internet y que Tailscale esté encendido.", true);
  }finally{
    btn.classList.remove("envio");
  }
});
async function cargar(){
  try{
    const res = await fetch(ESTADO_URL, { cache: "no-store" });
    if(!res.ok) throw new Error();
    const d = await res.json();
    productos = d.productos || [];
    try{ localStorage.setItem("mama.productos", JSON.stringify(productos)); }catch{}
    pintar();
  }catch{
    if(!productos.length) main.innerHTML = '<p class="estado">No se pudo cargar. Revisa tu internet y que Tailscale esté encendido.</p>';
  }
}
try{ const c = JSON.parse(localStorage.getItem("mama.productos")); if(c && c.length){ productos = c; pintar(); } }catch{}
cargar();
document.addEventListener("visibilitychange", () => { if(!document.hidden) cargar(); });
/* cambiar entre fondo blanco y oscuro (queda guardado en este celular) */
document.getElementById("tema").addEventListener("click", () => {
  const claro = document.documentElement.dataset.tema === "claro";
  document.documentElement.dataset.tema = claro ? "" : "claro";
  document.getElementById("colorTema").content = claro ? "#000000" : "#f4f5f7";
  try{ localStorage.setItem("mama.tema", claro ? "oscuro" : "claro"); }catch{}
});

/* Android ofrece «Instalar app» solo si hay manifest y service worker */
if("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
