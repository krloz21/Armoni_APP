<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reiniciar Armoni</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px system-ui,sans-serif;background:#0f1115;color:#f2f3f5;text-align:center;padding:24px}main{max-width:340px}h1{font-size:1.25rem}p{color:#a9afb9;line-height:1.5}button{margin-top:14px;min-height:48px;padding:0 22px;border:0;border-radius:14px;background:#4aa3ff;color:#06121f;font:inherit;font-weight:700}</style></head>
<body><main><h1>Reiniciando Armoni…</h1><p id="t">Borrando la copia guardada en este celular. No se pierde ningún registro.</p><button id="b" hidden>Abrir Armoni</button></main>
<script>
(async()=>{
  const t=document.getElementById("t"),b=document.getElementById("b");
  try{ if(navigator.serviceWorker){ const rs=await navigator.serviceWorker.getRegistrations(); for(const r of rs) await r.unregister(); } }catch{}
  try{ if(window.caches){ for(const k of await caches.keys()) await caches.delete(k); } }catch{}
  try{ sessionStorage.clear(); }catch{}   // lo guardado del usuario (registros sin enviar, ajustes) NO se toca
  t.textContent="Listo. Abriendo la versión nueva…";
  b.hidden=false; b.onclick=()=>location.replace("./?v="+Date.now());
  setTimeout(()=>location.replace("./?v="+Date.now()),1200);
})();
</script></body></html>
