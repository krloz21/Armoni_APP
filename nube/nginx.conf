server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25m;          # el comprobante de AT Gmail es una foto

  # comprimido: la app pasa de ~650 KB a ~170 KB por Tailscale; también las respuestas de n8n
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/html text/css application/javascript application/json application/manifest+json;

  # lo único que llega a n8n desde las páginas: los webhooks de producción
  location /webhook/ {
    proxy_pass http://n8n:5678;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
  }
}
