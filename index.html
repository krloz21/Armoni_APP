<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Armoni</title>

<!-- app en la pantalla de inicio del iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Armoni">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:   #000000;
  --panel:  rgba(6,8,13,.94);
  --line:   rgba(255,255,255,.11);
  --ghost:  rgba(255,255,255,.55);
  --dim:    rgba(255,255,255,.4);
  --white:  #f5f6f7;
  --blue:   #3f7cf6;
  --cyan:   #7ee8ff;
  --clay:   #f2734f;

  --sp:       clamp(16px, 4vw, 28px);
  --measure:  min(100%, 42rem);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}

*,*::before,*::after{ box-sizing:border-box; }
html{ height:100%; -webkit-text-size-adjust:100%; text-size-adjust:100%; touch-action:manipulation; }
body{
  height:100%; margin:0;
  background:var(--void); color:var(--white);
  font-family:"Schibsted Grotesk", system-ui, -apple-system, sans-serif;
  font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow:hidden;
  overscroll-behavior:none;
}
::selection{ background:rgba(63,124,246,.35); color:#fff; }

/* en reposo, todo lo animado se congela: cero consumo */
body.asleep *, body.asleep *::before, body.asleep *::after{ animation-play-state:paused !important; }

#rain{ position:fixed; inset:0; z-index:0; display:block; }

.shell{
  position:fixed; z-index:1;
  top:0; left:0; right:0;
  height:var(--app-h, 100dvh);
  transform:translateY(var(--app-top, 0px));
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
}

/* ───────── encabezado ───────── */
header{ padding:calc(var(--safe-top) + 10px) var(--sp) 4px; }
.bar{
  position:relative;
  width:min(100%, 46rem); margin:0 auto;
  display:flex; align-items:center; gap:11px;
  padding:9px 9px 9px 14px;
  border-radius:22px;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2), inset 0 -1px 0 rgba(255,255,255,.04), 0 14px 34px rgba(0,0,0,.38);
}
/* la marca se revela desde su centro, y un anillo fino converge sobre ella */
.markwrap{ position:relative; width:22px; height:22px; flex:none; display:block; }
.mark{ width:22px; height:22px; display:block; opacity:0; clip-path:circle(0% at 50% 50%); }
.shell.revealed .mark{
  opacity:1; clip-path:circle(56% at 50% 50%);
  transition:clip-path .55s cubic-bezier(.16,1,.3,1) .04s, opacity .2s ease .04s;
}
.markwrap::after{
  content:""; position:absolute; inset:-9px; border-radius:50%;
  border:1px solid rgba(126,232,255,.6);
  opacity:0; transform:scale(1.7);
  pointer-events:none;
}
.shell.revealed .markwrap::after{ animation:lockon .65s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes lockon{
  0%{   opacity:0;   transform:scale(1.7); }
  35%{  opacity:.65; }
  100%{ opacity:0;   transform:scale(.6); }
}

/* Armoni / Presupuesto de la casa */
.brandline{ display:flex; align-items:baseline; gap:7px; min-width:0; white-space:nowrap; }
.title{ font-weight:600; letter-spacing:-.01em; font-size:1.05rem; }
.sep{ color:rgba(255,255,255,.22); font-weight:300; font-size:.95rem; }
.sub{ font-size:.8rem; color:var(--dim); overflow:hidden; text-overflow:ellipsis; min-width:0; }
.brandline > *{ opacity:0; }
.shell.revealed .title{ animation:materialize .55s .3s cubic-bezier(.2,.75,.25,1) both; }
.shell.revealed .sep{   animation:materialize .5s .42s cubic-bezier(.2,.75,.25,1) both; }
.shell.revealed .sub{   animation:materialize .55s .5s cubic-bezier(.2,.75,.25,1) both; }
header button{
  display:inline-flex; align-items:center; gap:6px; flex:none;
  margin-left:auto; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1);
  color:var(--dim); font:inherit; font-size:.78rem;
  padding:6px 12px; border-radius:20px; cursor:pointer;
  transition:border-color .2s, color .2s;
}
header button:hover{ border-color:var(--blue); color:var(--white); }
header button:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
header button svg{ width:13px; height:13px; flex:none; }

/* ───────── hilo ───────── */
#thread{
  overflow-y:auto; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:30px var(--sp) 12px;
  -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 26px);
          mask-image:linear-gradient(180deg, transparent 0, #000 26px);
}
#thread::-webkit-scrollbar{ width:7px; }
#thread::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.1); border-radius:4px; }
.inner{ width:var(--measure); margin:0 auto; }

/* bienvenida: un solo titular que se escribe y se borra */
#welcome{
  min-height:calc(var(--app-h, 100dvh) - 250px);
  display:flex; align-items:center; justify-content:center;
  text-align:center;
}
.typer{
  font-size:clamp(1.6rem, 6vw, 2.55rem);
  min-height:2.3em;
  display:flex; align-items:center; justify-content:center;
  width:100%;
}
.typer h1{
  font-size:inherit; font-weight:600;
  line-height:1.14; letter-spacing:-.022em;
  margin:0; max-width:14em;
  background:linear-gradient(180deg, #ffffff 35%, #8fa4c4);
  -webkit-background-clip:text; background-clip:text;
  color:transparent;
}
.caret{
  display:inline-block; vertical-align:-.08em;
  width:.07em; height:.9em; margin-left:.08em;
  border-radius:1px;
  background:linear-gradient(180deg, var(--cyan), var(--blue));
  animation:caret 1s steps(1) infinite;
}
@keyframes caret{ 50%{ opacity:0; } }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* mensajes */
.msg{ margin-bottom:26px; }
.msg .body{ font-size:.97rem; line-height:1.62; color:rgba(245,246,247,.88); }
.msg.you{ display:flex; justify-content:flex-end; }
.msg.you .body{
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px 16px 4px 16px;
  padding:10px 16px; max-width:85%;
  transform-origin:right bottom;
  animation:lift .5s cubic-bezier(.16,1,.3,1) both;
}
.msg.bot .body{
  background:var(--panel); border:1px solid var(--line);
  border-radius:10px;
  padding:15px 18px;
  position:relative;
}

.msg.bot .body > :not(.tools){ animation:materialize .6s cubic-bezier(.2,.75,.25,1) both; }
@keyframes lift{ from{ opacity:0; transform:translateY(28px) scale(.97); } to{ opacity:1; transform:none; } }
@keyframes materialize{
  from{ opacity:0; filter:blur(9px); transform:translateY(7px); }
  to{ opacity:1; filter:blur(0); transform:none; }
}

.body > *:first-child{ margin-top:0; }
.body > *:last-child{ margin-bottom:0; }
.body p{ margin:0 0 .85em; }
.body strong{ font-weight:600; color:#fff; }
.body h1,.body h2,.body h3{ font-weight:600; letter-spacing:-.01em; margin:1.4em 0 .5em; line-height:1.25; }
.body h1{ font-size:1.2rem; } .body h2{ font-size:1.08rem; } .body h3{ font-size:1rem; }
.body ul,.body ol{ margin:0 0 .9em; padding-left:1.15em; }
.body li{ margin-bottom:.3em; }
.body li::marker{ color:var(--blue); }
.body hr{ border:0; border-top:1px solid var(--line); margin:1.4em 0; }
.body a{ color:var(--cyan); text-underline-offset:3px; }
.body code{ background:rgba(126,232,255,.1); color:var(--cyan); padding:1px 6px; border-radius:4px; font-size:.9em; }

.scroller{
  overflow-x:auto; margin:.2em 0 1.1em;
  border:1px solid rgba(255,255,255,.07); border-radius:9px;
  background:rgba(255,255,255,.015);
}
.scroller::-webkit-scrollbar{ height:6px; }
.scroller::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.15); border-radius:3px; }
.body table{ border-collapse:collapse; width:100%; font-size:.9rem; font-variant-numeric:tabular-nums; }
.body th{
  text-align:left; font-weight:500; color:var(--ghost);
  background:rgba(255,255,255,.03);
  border-bottom:1px solid rgba(255,255,255,.09);
  padding:9px 16px; white-space:nowrap;
}
.body td{ padding:9px 16px; border-bottom:1px solid rgba(255,255,255,.05); white-space:nowrap; }
.body tbody tr:last-child td{ border-bottom:0; font-weight:500; color:#fff; }
.body tbody tr:hover td{ background:rgba(126,232,255,.035); }
.body th.num, .body td.num{ text-align:right; }

.money{ font-variant-numeric:tabular-nums; font-weight:500; color:#e3eaf4; }
.money.neg{ color:var(--clay); }

.tools{
  position:absolute; top:9px; right:9px;
  opacity:0; transform:translateY(-3px);
  transition:opacity .2s, transform .2s;
}
.msg.bot:hover .tools, .msg.bot:focus-within .tools{ opacity:1; transform:none; }
.tools button{
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09);
  color:var(--dim); font:inherit; font-size:.7rem; font-weight:500;
  padding:4px 9px; border-radius:6px; cursor:pointer;
  transition:color .18s, border-color .18s, background .18s;
}
.tools button:hover{ color:var(--cyan); border-color:rgba(126,232,255,.4); background:rgba(126,232,255,.08); }
.tools button:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
@media (hover:none){ .tools{ opacity:.55; transform:none; } }

/* pensando */
#pending{ display:none; margin-bottom:26px; }
#pending.on{ display:block; padding-left:2px; }
#pending .state{
  font-size:.86rem; font-weight:500;
  background:linear-gradient(100deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.34) 38%, #eaf8ff 50%, rgba(255,255,255,.34) 62%, rgba(255,255,255,.34) 100%);
  background-size:260% 100%;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:shimmer 1.9s linear infinite;
  transition:opacity .28s ease, transform .28s ease;
}
@keyframes shimmer{ from{ background-position:130% 0; } to{ background-position:-130% 0; } }
#pending .state.swap{ opacity:0; transform:translateY(-4px); }

.alert{
  background:var(--panel); border:1px solid rgba(242,115,79,.3);
  border-radius:4px 16px 16px 16px; padding:15px 18px;
  color:var(--ghost); font-size:.92rem;
  animation:materialize .45s cubic-bezier(.2,.75,.25,1) both;
}
.alert b{ color:var(--clay); font-weight:600; display:block; margin-bottom:3px; }

/* ───────── escribir ───────── */
footer{ padding:10px var(--sp) calc(var(--safe-bot) + 14px); }

@property --spin{ syntax:"<angle>"; inherits:false; initial-value:0deg; }
.frame{
  position:relative;
  width:var(--measure); margin:0 auto;
  border-radius:18px;
}
/* la barra de luz que gira: solo el contorno, el centro queda libre para el vidrio */
.frame::before{
  content:""; position:absolute; inset:0; border-radius:inherit;
  padding:1.5px;
  background:conic-gradient(from var(--spin),
    transparent 0deg, transparent 40deg,
    var(--blue) 85deg, var(--cyan) 115deg, var(--blue) 145deg,
    transparent 195deg, transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
          mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  animation:orbit 7s linear infinite;
  opacity:.5; transition:opacity .35s;
  pointer-events:none; z-index:2;
}
/* el canto del vidrio: reflejo fino arriba */
.frame::after{
  content:""; position:absolute; inset:0; border-radius:inherit;
  border:1px solid rgba(255,255,255,.1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 14px 34px rgba(0,0,0,.35);
  pointer-events:none;
}
@keyframes orbit{ to{ --spin:360deg; } }
.frame:focus-within::before{ opacity:.9; }
.frame.sending::before{ opacity:.95; }


.composer{
  position:relative;
  display:flex; align-items:flex-end; gap:10px;
  border-radius:18px; background:rgba(4,7,13,.58);
  padding:9px 9px 9px 17px;
  z-index:1;
}
#field{
  flex:1; background:none; border:0; resize:none;
  color:var(--white); font:inherit;
  font-size:16px;              /* 16px evita que el iPhone haga zoom al escribir */
  line-height:1.5; max-height:34vh; padding:6px 0;
}
#field:focus{ outline:none; }
#field::placeholder{ color:var(--dim); }

#send{
  flex:none; width:38px; height:38px; border:0; border-radius:50%;
  background:linear-gradient(140deg, var(--cyan), var(--blue));
  color:#03070f; cursor:pointer; display:grid; place-items:center;
  transition:opacity .2s, transform .12s, box-shadow .25s;
}
#send:not(:disabled){ box-shadow:0 0 18px rgba(63,124,246,.45); }
#send:disabled{ opacity:.2; cursor:default; }
#send:not(:disabled):active{ transform:scale(.9); }
#send:focus-visible{ outline:2px solid var(--cyan); outline-offset:3px; }
#send svg{ width:17px; height:17px; transition:opacity .2s; }
#send{ position:relative; }
#send.busy{ opacity:1; background:rgba(255,255,255,.06); box-shadow:none; }
#send.busy svg{ opacity:0; }
#send.busy::after{
  content:""; position:absolute; width:18px; height:18px; border-radius:50%;
  border:1.5px solid rgba(126,232,255,.18); border-top-color:var(--cyan);
  animation:turn .8s linear infinite;
}
@keyframes turn{ to{ transform:rotate(360deg); } }

.hint{ width:var(--measure); margin:10px auto 0; font-size:.73rem; color:var(--dim); }



/* ───────── pantalla de carga ───────── */
#splash{
  position:fixed; inset:0; z-index:50;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:24px;
}
/* el negro es una capa aparte: se desvanece mientras el anillo vuela al encabezado */
#splash::before{
  content:""; position:absolute; inset:0; background:#000;
  transition:opacity .75s cubic-bezier(.4,0,.2,1) .12s;
}
#splash.out{ pointer-events:none; }
#splash.out::before{ opacity:0; }

#splash .orbwrap{ position:relative; z-index:1; width:136px; height:136px; will-change:transform; }
#splash .orbwrap canvas{ position:absolute; inset:0; width:100%; height:100%; }
#splash .orbwrap::before{
  content:""; position:absolute; inset:-34%;
  background:radial-gradient(circle, rgba(63,124,246,.34), rgba(99,80,255,.12) 38%, rgba(63,124,246,0) 62%);
  opacity:0; transition:opacity 1.1s ease;
}
#splash.lit .orbwrap::before{ opacity:1; }
#splash.out .orbwrap::before{ opacity:0; transition:opacity .3s ease; }
#splash.out .orbwrap{
  /* se condensa en su lugar y de ella sale el haz */
  transform:scale(.3); filter:blur(3px); opacity:0;
  transition:transform .5s cubic-bezier(.5,0,.2,1), filter .45s ease, opacity .38s ease .12s;
}

/* el haz de luz que viaja de la esfera a la esquina */
.streak{
  position:fixed; height:2px; margin-top:-1px;
  transform-origin:0 50%; overflow:hidden;
  pointer-events:none; z-index:60;
}
.streak i{
  position:absolute; top:0; left:0; height:100%; width:90px; border-radius:2px;
  background:linear-gradient(90deg, rgba(126,232,255,0), rgba(126,232,255,.8) 72%, #fff);
  box-shadow:0 0 6px rgba(126,232,255,.5);
  transform:translateX(-90px);
  animation:shoot .55s cubic-bezier(.65,0,.35,1) .16s forwards;
}
@keyframes shoot{ to{ transform:translateX(var(--len)); } }

/* la palabra sube desde una línea invisible, letra por letra */
#splash .word{
  position:relative; z-index:1;
  display:flex; justify-content:center;
  font-size:2.05rem; font-weight:600; letter-spacing:-.025em;
  line-height:1.2;
  overflow:hidden;
  padding:0 .06em .06em;
}
#splash .word span{
  display:inline-block;
  background-image:linear-gradient(180deg, #ffffff 35%, #8fa4c4);
  -webkit-background-clip:text; background-clip:text;
  color:transparent;
  transform:translateY(110%);
  animation:rise 1s cubic-bezier(.16,1,.3,1) forwards;
  animation-delay:calc(1.3s + var(--i) * 55ms);
}
@keyframes rise{ to{ transform:translateY(0); } }

#splash .brand{
  position:relative; z-index:1;
  display:flex; flex-direction:column; align-items:center; gap:6px;
}
#splash .tag{
  position:relative; z-index:1;
  font-size:.78rem; color:rgba(255,255,255,.4); letter-spacing:.04em;
  opacity:0;
  animation:tagin .9s cubic-bezier(.16,1,.3,1) 1.85s forwards;
}
@keyframes tagin{ from{ opacity:0; transform:translateY(5px); } to{ opacity:1; transform:none; } }

#splash.out .brand{
  opacity:0; filter:blur(6px); transform:translateY(-8px);
  transition:opacity .35s ease, filter .35s ease, transform .35s ease;
}

body.no-gl{ background:radial-gradient(120% 80% at 70% 8%, #0b1a3a 0%, #02040a 62%) fixed; }
body.no-gl .bar, body.no-gl .composer{ background:rgba(14,18,28,.9); }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
@media (max-width:540px){
  header{ gap:10px; }
  #reset .lbl{ display:none; }                    /* en el celular, solo el ícono: así cabe el subtítulo */
  #reset{ padding:7px; border-radius:50%; }
  #thread{ padding-top:22px; }
  .hint{ display:none; }
  #welcome{ min-height:calc(var(--app-h, 100dvh) - 210px); }
}
</style>
</head>
<body>

<div id="splash" aria-hidden="true">
  <div class="orbwrap" id="orbwrap">
    <canvas id="splashRing"></canvas>
  </div>
  <div class="brand">
    <div class="word" id="splashWord"></div>
    <div class="tag" id="splashTag">Presupuesto de la casa</div>
  </div>
</div>
<canvas id="rain" aria-hidden="true"></canvas>

<div class="shell">

  <header>
    <div class="bar" id="bar">
      <span class="markwrap" aria-hidden="true"><canvas class="mark" id="mark"></canvas></span>
      <div class="brandline">
        <span class="title">Armoni</span><span class="sep">/</span><span class="sub">Presupuesto de la casa</span>
      </div>
      <button id="reset" type="button" aria-label="Empezar de nuevo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        <span class="lbl">Empezar de nuevo</span>
      </button>
    </div>
  </header>

  <main id="thread" tabindex="-1">
    <div class="inner">

      <section id="welcome">
        <p class="sr">Armoni. Escribe un gasto para guardarlo, o pregunta por lo que llevan gastado.</p>
        <div class="typer" aria-hidden="true">
          <h1><span id="typed"></span><span class="caret"></span></h1>
        </div>
      </section>

      <div id="messages"></div>

      <div id="pending" aria-live="polite">
        <span class="state" id="state">Revisando el presupuesto</span>
      </div>

    </div>
  </main>

  <footer>
    <div class="frame" id="frame">
      <form class="composer" id="composer">
        <textarea id="field" rows="1" placeholder="Escribe aquí…" autocomplete="off" enterkeyhint="send"></textarea>
        <button id="send" type="submit" disabled aria-label="Enviar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
    </div>
    <div class="hint">Enter envía · Shift + Enter hace salto de línea</div>
  </footer>

</div>

<script>
/* ════════════════════════════════════════════════════════════
   AJUSTES
   ════════════════════════════════════════════════════════════ */
const WEBHOOK_URL = "http://192.168.1.7:5678/webhook/81c2fc99-c68b-40bb-9655-9cadb658f250/chat";
const REPOSO_SEGUNDOS  = 90;   // sin tocar nada: la animación se congela
const REINICIO_MINUTOS = 15;   // sin usarla: la conversación empieza de cero

const FRASES_BASE = [
  "¿Qué anotamos hoy?",
  "¿Cuánto llevamos gastado este mes?",
  "Anota 25.000 de mercado",
  "¿En qué se nos va más la plata?",
  "Compara este mes con el anterior"
];

/* ── aniversario: cada 22 de abril ──
   Cambia "nombre" por el nombre de ella si quieres, y edita los mensajes a tu gusto.
   Para verlo hoy sin esperar: abre la app agregando ?aniversario al final de la dirección. */
const ANIVERSARIO = {
  mes: 4, dia: 22,
  casadosDesde: 2023,
  nombre: "mi amor",
  mensajes: n => [
    "Feliz aniversario, {nombre}",
    n + (n === 1 ? " año" : " años") + " de casados",
    "Te amo muchísimo",
    "Gracias por construir esta casa conmigo"
  ]
};

const HOY = new Date();
const ES_ANIVERSARIO =

/* ── teclado: la app ocupa solo lo que se ve, así no se descuadra ── */
(function fitViewport(){
  const vv = window.visualViewport;
  if(!vv) return;
  const root = document.documentElement.style;
  const fit = () => {
    root.setProperty("--app-h", vv.height + "px");
    root.setProperty("--app-top", vv.offsetTop + "px");
  };
  vv.addEventListener("resize", fit);
  vv.addEventListener("scroll", fit);
  addEventListener("orientationchange", () => setTimeout(fit, 250));
  fit();
})();

/* ════════════════════════════════════════════════════════════
   MARCA DE ARMONI: esfera minimalista
   Un solo gradiente suave (cian → azul → índigo) y un leve
   reflejo de luz. rot: dirección del gradiente · scale: tamaño
   ════════════════════════════════════════════════════════════ */
function drawMark(ctx, cx, cy, S, o = {}){
  const rot = o.rot ?? 0, scale = o.scale ?? 1, glow = o.glow ?? 0;
  const R = S * 0.5 * scale;
  if(R < 0.5) return;
  const TAU = Math.PI * 2;

  if(glow > 0){
    const g = ctx.createRadialGradient(cx, cy, R * 0.7, cx, cy, R * 1.8);
    g.addColorStop(0, "rgba(63,124,246," + (0.3 * glow) + ")");
    g.addColorStop(1, "rgba(63,124,246,0)");
    ctx.fillStyle = g;
    ctx.fillRect(cx - R * 2, cy - R * 2, R * 4, R * 4);
  }

  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip();

  /* el gradiente, en diagonal (gira con rot) */
  const a = -Math.PI * 0.75 + rot;
  const dx = Math.cos(a) * R, dy = Math.sin(a) * R;
  const g = ctx.createLinearGradient(cx + dx, cy + dy, cx - dx, cy - dy);
  g.addColorStop(0,   "#6ff0ff");
  g.addColorStop(.5,  "#3a78ff");
  g.addColorStop(1,   "#5a3fe0");
  ctx.fillStyle = g;
  ctx.fillRect(cx - R, cy - R, R * 2, R * 2);

  /* un leve reflejo de luz, sin bordes duros */
  const sp = ctx.createRadialGradient(cx - R * .35, cy - R * .4, 0, cx - R * .35, cy - R * .4, R * .75);
  sp.addColorStop(0, "rgba(255,255,255,.28)");
  sp.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = sp;
  ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  ctx.restore();
}


function ringCanvas(canvas, cssSize){
  const d = Math.min(3, devicePixelRatio || 1);
  canvas.width = canvas.height = Math.round(cssSize * d);
  canvas.style.width = canvas.style.height = cssSize + "px";
  return { ctx: canvas.getContext("2d"), px: canvas.width };
}

/* marca pequeña del encabezado */
(function(){
  const el = document.getElementById("mark");
  if(!el || !el.getContext) return;
  const { ctx, px } = ringCanvas(el, 22);
  drawMark(ctx, px / 2, px / 2, px * 0.86);
})();


/* ════════════════════════════════════════════════════════════
   FONDO (WebGL): cintas de luz + Liquid Glass real
   Todo lo pinta la GPU en un solo programa. El encabezado y el
   campo de escribir refractan lo que hay detrás de ellos.
   ════════════════════════════════════════════════════════════ */
const Rain = (function(){
  const canvas = document.getElementById("rain");
  const gl = canvas.getContext("webgl", { antialias:false, alpha:false, depth:false, stencil:false, powerPreference:"low-power" });

  const api = { send(){}, settle(){}, reading(){}, sleep(){}, wake(){}, glass(){} };
  if(!gl){ document.body.classList.add("no-gl"); canvas.style.display = "none"; return api; }

  const VS = "attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}";
  const FS = `
precision highp float;
uniform vec2  uCanvas;
uniform vec2  uRes;
uniform float uScale;
uniform float uTime;
uniform float uSend;
uniform float uReply;
uniform float uWait;
uniform float uNarrow;
uniform vec4  uRect[2];
uniform float uRad[2];
uniform float uDim;

float h1(float n){ return fract(sin(n * 12.9898) * 43758.5453); }
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1., 0.)), u.x), mix(hash(i + vec2(0., 1.)), hash(i + vec2(1., 1.)), u.x), u.y);
}
float easeOut(float x){ return 1. - pow(1. - x, 2.4); }

/* ── las líneas que caen: una por columna, formando la ola diagonal ── */
vec3 lines(vec2 pc, float t){
  float GAP = uNarrow > .5 ? 26. : 34.;
  float i = floor(pc.x / GAP);
  float cx = i * GAP + GAP * .5;
  float dx = pc.x - cx;
  float phase = sin(i / 5.5) * 130.;
  float spd = 46. * (.75 + .5 * abs(sin(i * .37)));
  float span = uRes.y + 282.;
  float y0 = mod(h1(i + .3) * span + t * spd + phase, span) - 130.;

  /* la ola de luz al enviar (sube) y al responder (baja, más suave) */
  float BAND = uNarrow > .5 ? 215. : 200.;
  float kS = clamp(uSend / 1.7, 0., 1.), kR = clamp(uReply / 1.7, 0., 1.);
  float fS = (1. - pow(kS, 2.2)) * step(uSend, 1.7);
  float fR = (1. - pow(kR, 2.2)) * step(uReply, 1.7) * .5;
  float frS = uRes.y + 140. - easeOut(kS) * (uRes.y + 440.) + phase * .32;
  float frR = -140. + easeOut(kR) * (uRes.y + 440.) + phase * .32;
  float gS = exp(-pow((y0 + 11. - frS) / BAND, 2.)) * fS;
  float gR = exp(-pow((y0 + 11. - frR) / BAND, 2.)) * fR;
  float shim = max(0., sin(t * 1.22 - cx / 380.)) * .16 * uWait;
  /* cada línea resalta con su propio azar, no todas por igual */
  float rnd = .55 + .45 * h1(i + 2.2);
  float glow = clamp(max(max(gS, gR), shim) * rnd * (uNarrow > .5 ? 1.25 : 1.05), 0., 1.);

  float len = 22. * (1. + glow * 1.3);
  float top = y0 - (len - 22.) * .5;
  float vy = (pc.y - top) / len;
  if(vy < 0. || vy > 1.) return vec3(0.);
  float vprof = sin(vy * 3.14159);            /* simétrico: un resalte, no una dirección */

  bool accent = h1(i + 9.1) < .05;
  float shade = h1(i + 4.4) < .5 ? .15 : .07;
  float coreW = (accent ? 1.2 : .85) * (1. + glow * .5);
  float core = smoothstep(coreW + .6, coreW - .4, abs(dx));
  float a = min(1., (accent ? .55 : shade) * uDim + glow * .8) * vprof;

  vec3 baseCol = accent ? vec3(.27, .51, .98) : vec3(.82, .88, 1.);
  vec3 glowCol = vec3(.74, .92, 1.);
  vec3 col = mix(baseCol, glowCol, glow * .8) * core * a;
  float hw = 2.5 + glow * 6.;
  col += glowCol * exp(-dx * dx / (hw * hw)) * vprof * glow * .38;
  return col;
}

/* ── la malla de puntos 3D, muy tenue, abajo a la derecha ── */
vec3 mesh(vec2 pc, float t){
  vec2 norm = pc / uRes;
  float cellPx = mix(15., 23., clamp(norm.x * .5 + norm.y * .5, 0., 1.));
  vec2 gi = floor(pc / cellPx);
  vec2 jitter = vec2(hash(gi + .15), hash(gi + 7.7)) - .5;
  vec2 home = (gi + .5 + jitter * .4) * cellPx;
  vec2 cn = home / uRes;

  float density = pow(smoothstep(0., .72, cn.x) * smoothstep(.05, .82, cn.y), .62);

  /* dos ondas lentas cruzadas: la superficie ondula como un terreno que respira */
  float s1 = sin(cn.x * 6.5 + cn.y * 2.5 - t * .5) * .5 + .5;
  float s2 = sin(cn.x * 2.7 - cn.y * 4.2 + t * .32) * .5 + .5;
  float surf = s1 * .6 + s2 * .4;
  vec2 center = home + vec2(0., -(surf - .5) * 6. * density);   /* los puntos suben y bajan con la ola */

  float h = (noise(cn * 5.2 + t * .05) * .35 + surf * .65) * density;

  float rad = mix(.5, 1.8, clamp(h * 1.4, 0., 1.)) * (.55 + .45 * hash(gi + 3.3));
  float dotv = smoothstep(rad, rad - 1., length(pc - center));
  float bright = clamp(.1 + h * 1.6, 0., 1.) * density;
  return dotv * bright * mix(vec3(.4, .46, .56), vec3(.8, .9, 1.), clamp(h * 1.5, 0., 1.));
}

vec3 scene(vec2 pc){
  return lines(pc, uTime) + mesh(pc, uTime) * .42 * uDim;
}

float sdBox(vec2 p, vec2 b, float r){
  vec2 q = abs(p) - b + r;
  return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r;
}

/* Liquid Glass: curva la luz en los bordes, separa colores, esmerila y refleja */
vec3 glass(vec2 pc, vec2 c, vec2 hs, float R, float d){
  vec2 e = vec2(1., 0.);
  vec2 n = normalize(vec2(sdBox(pc + e.xy - c, hs, R) - sdBox(pc - e.xy - c, hs, R),
                          sdBox(pc + e.yx - c, hs, R) - sdBox(pc - e.yx - c, hs, R)) + 1e-5);
  float k = clamp(-d / 22., 0., 1.);
  float bend = pow(1. - k, 2.2) * 24.;
  vec2 off = -n * bend - (pc - c) * .05;

  vec3 a = scene(pc + off);
  float rr = scene(pc + off * 1.18 + vec2(3., 2.)).r;
  float bb = scene(pc + off * .82 - vec2(3., 2.)).b;
  vec3 g = vec3(mix(a.r, rr, .6), a.g, mix(a.b, bb, .6));
  g = mix(g, scene(pc + off + vec2(0., 8.)), .35);

  g = g * .7 + vec3(.012, .017, .03);
  vec2 L = normalize(vec2(-.55, -.85));
  float facing = max(dot(n, L), 0.);
  g += vec3(.8, .92, 1.) * exp(d / 1.8) * (.08 + .32 * facing);
  return g;
}

void main(){
  vec2 pc = vec2(gl_FragCoord.x, uCanvas.y - gl_FragCoord.y) / uScale;
  vec3 col = scene(pc);
  for(int i = 0; i < 2; i++){
    vec4 r = uRect[i];
    if(r.z < 1.) continue;
    vec2 hs = r.zw * .5, c = r.xy + hs;
    float d = sdBox(pc - c, hs, uRad[i]);
    if(d < 1.2){
      float m = smoothstep(1.2, -1.2, d);
      col = mix(col, glass(pc, c, hs, uRad[i], d), m);
    }
  }
  gl_FragColor = vec4(col, 1.);
}`;

  function shc(type, src){
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  }
  let prog;
  try{
    prog = gl.createProgram();
    gl.attachShader(prog, shc(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, shc(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  }catch(err){
    console.warn("Fondo sin WebGL:", err);
    document.body.classList.add("no-gl"); canvas.style.display = "none"; return api;
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "a");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const U = n => gl.getUniformLocation(prog, n);
  const uCanvas = U("uCanvas"), uRes = U("uRes"), uScale = U("uScale"), uTime = U("uTime");
  const uSend = U("uSend"), uReply = U("uReply"), uWait = U("uWait"), uNarrow = U("uNarrow");
  const uRect = U("uRect"), uRad = U("uRad"), uDim = U("uDim");

  /* líneas de 1px: necesitan resolución real, pero sin pasar de 1.5x */
  const SCALE = Math.min(1.5, devicePixelRatio || 1);
  let w = 0, h = 0;
  function build(){
    w = innerWidth; h = innerHeight;
    canvas.width = Math.max(1, Math.round(w * SCALE));
    canvas.height = Math.max(1, Math.round(h * SCALE));
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    gl.viewport(0, 0, canvas.width, canvas.height);
  }

  const glassEls = [];
  const rects = new Float32Array(8), radii = new Float32Array(2);
  function readRadii(){
    for(let i = 0; i < 2; i++){
      const el = glassEls[i];
      radii[i] = el ? (parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0) : 0;
    }
  }
  function readGlass(){
    for(let i = 0; i < 2; i++){
      const el = glassEls[i];
      if(!el || !el.isConnected){ rects[i*4+2] = 0; continue; }
      const r = el.getBoundingClientRect();
      rects[i*4] = r.left; rects[i*4+1] = r.top; rects[i*4+2] = r.width; rects[i*4+3] = r.height;
    }
  }

  let clock = 0, lastT = performance.now(), wait = 0, waiting = false;
  let sendAt = -1e9, replyAt = -1e9;
  let dim = 1, dimTarget = 1;          // con conversación en pantalla, el fondo se apaga para leer tranquilo
  let raf = null, lastDraw = 0, asleep = false;

  function draw(now){
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    wait += ((waiting ? 1 : 0) - wait) * 0.05;
    dim  += (dimTarget - dim) * 0.04;
    clock += dt;
    readGlass();
    gl.uniform2f(uCanvas, canvas.width, canvas.height);
    gl.uniform2f(uRes, w, h);
    gl.uniform1f(uScale, SCALE);
    gl.uniform1f(uTime, clock);
    gl.uniform1f(uSend, (now - sendAt) / 1000);
    gl.uniform1f(uReply, (now - replyAt) / 1000);
    gl.uniform1f(uWait, wait);
    gl.uniform1f(uDim, dim);
    gl.uniform1f(uNarrow, w < 560 ? 1 : 0);
    gl.uniform4fv(uRect, rects);
    gl.uniform1fv(uRad, radii);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function loop(now){
    raf = requestAnimationFrame(loop);
    const lively = waiting || wait > 0.01 || now - sendAt < 1900 || now - replyAt < 1900 || Math.abs(dim - dimTarget) > 0.005;
    if(!lively && now - lastDraw < 33) return;   // 30 cuadros en calma, 60 con la ola
    lastDraw = now;
    draw(now);
  }
  function start(){ if(raf || asleep) return; lastT = performance.now(); raf = requestAnimationFrame(loop); }
  function stop(){ if(raf) cancelAnimationFrame(raf); raf = null; }

  build();
  addEventListener("resize", () => { build(); readRadii(); draw(performance.now()); });
  if(REDUCED){ draw(performance.now()); } else start();

  return {
    glass(...els){ glassEls.length = 0; glassEls.push(...els); readRadii(); },
    send(){ sendAt = performance.now(); waiting = true; start(); },
    settle(){ waiting = false; replyAt = performance.now(); start(); },
    reading(on){ dimTarget = on ? 0.42 : 1; start(); },
    sleep(){ asleep = true; stop(); },
    wake(){ asleep = false; if(!REDUCED) start(); }
  };
})();




/* ════════════════════════════════════════════════════════════
   TITULAR QUE SE ESCRIBE Y SE BORRA
   ════════════════════════════════════════════════════════════ */
const Typer = (function(){
  const el = document.getElementById("typed");
  let timer = null, i = 0, pos = 0, deleting = false, running = false;

  function tick(){
    const p = FRASES[i];
    if(!deleting){
      pos++;
      el.textContent = p.slice(0, pos);
      if(pos >= p.length){ deleting = true; timer = setTimeout(tick, 2300); return; }
      timer = setTimeout(tick, 45 + Math.random() * 45);
    } else {
      pos--;
      el.textContent = p.slice(0, pos);
      if(pos <= 0){ deleting = false; i = (i + 1) % FRASES.length; timer = setTimeout(tick, 420); return; }
      timer = setTimeout(tick, 22);
    }
  }

  return {
    start(fresh){
      if(fresh){ clearTimeout(timer); running = false; i = 0; pos = 0; deleting = false; el.textContent = ""; }
      if(running) return;
      running = true;
      if(REDUCED){ el.textContent = FRASES[0]; return; }
      timer = setTimeout(tick, 300);
    },
    stop(){ running = false; clearTimeout(timer); }
  };
})();


/* ════════════════════════════════════════════════════════════
   SESIÓN Y REPOSO
   ════════════════════════════════════════════════════════════ */
const K_SES = "armoni.sesion", K_ACT = "armoni.actividad";
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));

let sessionId = localStorage.getItem(K_SES) || newId();
localStorage.setItem(K_SES, sessionId);

const $ = s => document.querySelector(s);
const thread = $("#thread"), list = $("#messages"), pending = $("#pending");
const field = $("#field"), send = $("#send"), welcome = $("#welcome"), frame = $("#frame");
let busy = false, sleeping = false, sleepTimer = null, lastTouch = 0;
if(Rain.glass) Rain.glass(document.getElementById("bar"), frame);

let lastAct = +localStorage.getItem(K_ACT) || 0;
const RESET_MS = REINICIO_MINUTOS * 60000;

function newConversation(){
  sessionId = newId();
  localStorage.setItem(K_SES, sessionId);
  list.innerHTML = "";
  welcome.style.display = "";
  field.value = ""; grow(); lock();
  thread.scrollTop = 0;
  lastAsked = null;
  syncReading();
  if(!sleeping) Typer.start(true);
}

function goToSleep(){
  if(busy){ scheduleSleep(); return; }
  sleeping = true;
  document.body.classList.add("asleep");
  Rain.sleep();
  Typer.stop();
}

function wakeUp(){
  if(!sleeping) return;
  sleeping = false;
  document.body.classList.remove("asleep");
  Rain.wake();
  if(welcome.style.display !== "none") Typer.start();
}

function scheduleSleep(){
  clearTimeout(sleepTimer);
  sleepTimer = setTimeout(goToSleep, REPOSO_SEGUNDOS * 1000);
}

function activity(){
  const now = Date.now();
  if(now - lastTouch < 800 && !sleeping) return;   // no repetir trabajo en cada toque
  lastTouch = now;
  if(lastAct && now - lastAct > RESET_MS && list.children.length) newConversation();
  lastAct = now;
  localStorage.setItem(K_ACT, String(now));
  wakeUp();
  scheduleSleep();
}

["pointerdown","keydown","wheel","touchstart"].forEach(ev =>
  document.addEventListener(ev, activity, { passive:true }));
thread.addEventListener("scroll", activity, { passive:true });

document.addEventListener("visibilitychange", () => {
  if(document.hidden){ clearTimeout(sleepTimer); goToSleep(); }
  else activity();
});

/* al abrir: si pasó mucho tiempo, arrancar limpio */
if(lastAct && Date.now() - lastAct > RESET_MS){
  sessionId = newId();
  localStorage.setItem(K_SES, sessionId);
}


/* ════════════════════════════════════════════════════════════
   TEXTO
   ════════════════════════════════════════════════════════════ */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function inline(s){
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function plata(html){
  return html.replace(
    /(-?\s?\$\s?-?[\d][\d.,]*)|(-?\b\d{1,3}(?:[.,]\d{3}){1,}\b)/g,
    m => '<span class="money' + (/^-|\$\s?-/.test(m.trim()) ? " neg" : "") + '">' + m + "</span>"
  );
}

function render(raw){
  const lines = esc(raw).replace(/\r/g,"").split("\n");
  let out = "", i = 0, para = [], bullets = null;
  const flushPara = () => { if(para.length){ out += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };
  const flushList = () => { if(bullets){ out += "<" + bullets.tag + ">" + bullets.items.map(x => "<li>" + inline(x) + "</li>").join("") + "</" + bullets.tag + ">"; bullets = null; } };
  const flushAll = () => { flushPara(); flushList(); };

  while(i < lines.length){
    const t = lines[i].trim();
    if(!t){ flushAll(); i++; continue; }

    if(/^\|.*\|$/.test(t) && i + 1 < lines.length && /^\|[\s:|-]+\|$/.test(lines[i+1].trim())){
      flushAll();
      const cells = r => r.trim().replace(/^\||\|$/g,"").split("|").map(c => c.trim());
      const head = cells(t);
      i += 2;
      const rows = [];
      while(i < lines.length && /^\|.*\|$/.test(lines[i].trim())){ rows.push(cells(lines[i].trim())); i++; }
      out += '<div class="scroller"><table><thead><tr>' +
             head.map(x => "<th>" + inline(x) + "</th>").join("") +
             "</tr></thead><tbody>" +
             rows.map(r => "<tr>" + r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") +
             "</tbody></table></div>";
      continue;
    }

    const hd = t.match(/^(#{1,4})\s+(.*)$/);
    if(hd){ flushAll(); const lvl = Math.min(3, hd[1].length); out += "<h" + lvl + ">" + inline(hd[2]) + "</h" + lvl + ">"; i++; continue; }
    if(/^([-*_])\1{2,}$/.test(t)){ flushAll(); out += "<hr>"; i++; continue; }

    const b = t.match(/^[-*•]\s+(.*)$/);
    const n = t.match(/^\d+[.)]\s+(.*)$/);
    if(b || n){
      flushPara();
      const tag = b ? "ul" : "ol";
      if(!bullets || bullets.tag !== tag){ flushList(); bullets = { tag, items: [] }; }
      bullets.items.push((b || n)[1]);
      i++; continue;
    }
    flushList();
    para.push(t);
    i++;
  }
  flushAll();
  return plata(out);
}

function alignNumbers(scope){
  scope.querySelectorAll("table").forEach(tb => {
    const rows = [...tb.querySelectorAll("tbody tr")];
    if(!rows.length) return;
    const cols = rows[0].children.length;
    for(let c = 0; c < cols; c++){
      let cifras = 0, total = 0;
      rows.forEach(r => {
        const cell = r.children[c]; if(!cell) return;
        total++;
        if(/^[-+$\s]*\d[\d.,\s]*(COP|USD|%)?$/i.test(cell.textContent.trim())) cifras++;
      });
      if(total && cifras / total >= 0.6){
        rows.forEach(r => r.children[c] && r.children[c].classList.add("num"));
        const th = tb.querySelectorAll("thead th")[c];
        if(th) th.classList.add("num");
      }
    }
  });
}


/* ════════════════════════════════════════════════════════════
   CONVERSACIÓN
   ════════════════════════════════════════════════════════════ */
function syncReading(){
  if(!list.children.length){ Rain.reading(false, 0, 0); return; }
  const r = document.querySelector(".inner").getBoundingClientRect();
  Rain.reading(true, r.left - 14, r.right + 14);
}
addEventListener("resize", syncReading);

function hideWelcome(){
  if(welcome.style.display === "none") return;
  welcome.style.display = "none";
  Typer.stop();
}

function add(who, raw){
  hideWelcome();
  const wrap = document.createElement("div");
  wrap.className = "msg " + (who === "you" ? "you" : "bot");
  const body = document.createElement("div");
  body.className = "body";
  body.innerHTML = who === "you" ? "<p>" + inline(esc(raw)) + "</p>" : render(raw);

  if(who !== "you"){
    alignNumbers(body);
    [...body.children].forEach((el, i) => { el.style.animationDelay = REDUCED ? "0ms" : Math.min(i * 55, 600) + "ms"; });

    const tools = document.createElement("div");
    tools.className = "tools";
    const btn = document.createElement("button");
    btn.type = "button"; btn.textContent = "Copiar";
    btn.addEventListener("click", async () => {
      try{ await navigator.clipboard.writeText(raw); btn.textContent = "Copiado"; }
      catch{ btn.textContent = "No se pudo"; }
      setTimeout(() => { btn.textContent = "Copiar"; }, 1600);
    });
    tools.appendChild(btn);
    body.appendChild(tools);
  }

  wrap.appendChild(body);
  list.appendChild(wrap);
  syncReading();
  if(who === "you"){ lastAsked = wrap; toBottom(); }
  else revealFrom(lastAsked);
}

/* deja tu pregunta arriba y la respuesta empezando justo debajo */
let lastAsked = null;
function revealFrom(el){
  if(!el || !el.isConnected){ toBottom(); return; }
  requestAnimationFrame(() => {
    const top = el.getBoundingClientRect().top - thread.getBoundingClientRect().top + thread.scrollTop - 14;
    thread.scrollTo({ top: Math.max(0, top), behavior: REDUCED ? "auto" : "smooth" });
  });
}

function problem(title, detail){
  hideWelcome();
  const wrap = document.createElement("div");
  wrap.className = "msg";
  wrap.innerHTML = '<div class="alert"><b>' + esc(title) + "</b>" + esc(detail) + "</div>";
  list.appendChild(wrap);
  syncReading();
  toBottom();
}

function toBottom(){ requestAnimationFrame(() => { thread.scrollTop = thread.scrollHeight; }); }

const ESTADOS = ["Revisando el presupuesto", "Buscando los movimientos", "Sacando las cuentas", "Redactando la respuesta"];
let stateTimer = null;

function startStates(){
  const el = document.getElementById("state");
  let i = 0;
  el.textContent = ESTADOS[0];
  el.classList.remove("swap");
  pending.classList.add("on");
  clearInterval(stateTimer);
  stateTimer = setInterval(() => {
    if(i >= ESTADOS.length - 1){ clearInterval(stateTimer); return; }
    i++;
    el.classList.add("swap");
    setTimeout(() => { el.textContent = ESTADOS[i]; el.classList.remove("swap"); }, 280);
  }, 2600);
}
function stopStates(){ clearInterval(stateTimer); stateTimer = null; pending.classList.remove("on"); }

async function ask(text){
  if(busy || !text.trim()) return;
  busy = true;
  activity();
  Rain.send();
  frame.classList.add("sending");
  send.classList.add("busy");
  add("you", text.trim());
  field.value = ""; grow(); lock();
  if(TOUCH) field.blur();
  startStates(); toBottom();

  try{
    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "sendMessage", sessionId, chatInput: text.trim() })
    });

    if(!res.ok){
      problem("Armoni respondió con un error (" + res.status + ")",
              "Revisa en n8n que el flujo esté publicado y que el nodo del chat siga activo.");
    } else {
      const txt = await res.text();
      let reply = "";
      try{
        const data = JSON.parse(txt);
        reply = data.output || data.text || data.message || data.response || (typeof data === "string" ? data : "");
      }catch{ reply = txt; }

      if(reply && String(reply).trim()) add("bot", String(reply));
      else problem("Llegó una respuesta vacía",
                   "El flujo corrió pero no devolvió texto. Mira la pestaña Executions en n8n para ver qué pasó.");
    }
  }catch(e){
    problem("No se pudo conectar con Armoni",
            "Verifica que la torre esté prendida, que Docker esté corriendo y que estés en el WiFi de la casa.");
  }finally{
    stopStates();
    frame.classList.remove("sending");
    send.classList.remove("busy");
    Rain.settle();
    busy = false; lock();
    if(!TOUCH) field.focus();
    scheduleSleep();
  }
}

function grow(){ field.style.height = "auto"; field.style.height = field.scrollHeight + "px"; }
function lock(){ send.disabled = busy || !field.value.trim(); }

field.addEventListener("input", () => { grow(); lock(); });
field.addEventListener("focus", () => setTimeout(() => { window.scrollTo(0, 0); if(list.children.length) toBottom(); }, 60));
field.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey && !TOUCH){ e.preventDefault(); ask(field.value); }
});
$("#composer").addEventListener("submit", e => { e.preventDefault(); ask(field.value); });
$("#reset").addEventListener("click", newConversation);

/* arranque: pantalla de carga, luego la app */
(function splash(){
  const el = document.getElementById("splash");
  const word = document.getElementById("splashWord");
  "Armoni".split("").forEach((ch, i) => {
    const sp = document.createElement("span");
    sp.textContent = ch;
    sp.style.setProperty("--i", i);
    word.appendChild(sp);
  });

  if(ES_ANIVERSARIO){
    document.getElementById("splashTag").textContent =
      "Feliz aniversario · " + ANOS_JUNTOS + (ANOS_JUNTOS === 1 ? " año juntos" : " años juntos");
  }

  if(REDUCED){ el.remove(); document.querySelector(".shell").classList.add("revealed"); Typer.start(true); return; }

  const HOLD = ES_ANIVERSARIO ? 3700 : 2700;
  const orb = document.getElementById("orbwrap");
  const rc = document.getElementById("splashRing");
  const SIZE = 132;
  const { ctx, px } = ringCanvas(rc, SIZE);
  const clamp = x => Math.max(0, Math.min(1, x));
  const outCubic = x => 1 - Math.pow(1 - x, 3);
  const outBack  = x => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

  const t0 = performance.now();
  let running = true, lit = false;

  /* dos aros nacen separados y se encuentran en el centro, con un leve rebote */
  (function paint(now){
    if(!running) return;
    const t = now - t0;
    ctx.clearRect(0, 0, px, px);
    drawMark(ctx, px / 2, px / 2, px * 0.86, {
      scale: outBack(clamp((t - 120) / 850)),
      rot:   Math.PI * 2.5 * (1 - outCubic(clamp(t / HOLD)))   // gira rápido y se frena justo en la posición del encabezado
    });
    if(!lit && t > 900){ lit = true; el.classList.add("lit"); }
    requestAnimationFrame(paint);
  })(t0);

  let done = false;
  function enter(){
    if(done) return;
    done = true;

    /* un haz de luz viaja en línea recta desde la esfera hasta la marca del encabezado */
    const mark = document.getElementById("mark");
    if(mark){
      const m = mark.getBoundingClientRect(), o = orb.getBoundingClientRect();
      const x1 = o.left + o.width / 2, y1 = o.top + o.height / 2;
      const x2 = m.left + m.width / 2, y2 = m.top + m.height / 2;
      const len = Math.hypot(x2 - x1, y2 - y1);
      const st = document.createElement("div");
      st.className = "streak";
      st.style.cssText = "left:" + x1 + "px;top:" + y1 + "px;width:" + len + "px;transform:rotate(" + Math.atan2(y2 - y1, x2 - x1) + "rad)";
      st.style.setProperty("--len", len + "px");
      st.innerHTML = "<i></i>";
      document.body.appendChild(st);
      setTimeout(() => st.remove(), 900);
    }
    el.classList.add("out");
    setTimeout(() => document.querySelector(".shell").classList.add("revealed"), 640);   // la marca nace cuando llega el haz
    setTimeout(() => { running = false; el.remove(); }, 1000);
    Typer.start(true);
    if(!TOUCH) field.focus();
  }

  setTimeout(enter, HOLD);
  el.addEventListener("pointerdown", enter);   // un toque la salta
})();
activity();
</script>
